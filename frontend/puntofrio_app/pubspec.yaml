name: puntofrio_app
description: "Sistema de Inteligencia y Control de Inventario para Grupo Punto Frio"
publish_to: 'none'
version: 1.6.0+7

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3+1
  sqflite: ^2.3.3+1
  path: ^1.9.0
  uuid: ^4.4.0
  intl: ^0.19.0
  image_picker: ^1.1.2
  connectivity_plus: ^6.0.3
  shared_preferences: ^2.2.3
  pdf: ^3.10.8
  printing: ^5.12.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
